name: Jig validation

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Ameyalli
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate with immutable Jig Action
        uses: albertovillaosorno/jig@44b6df689e0f52e30fe62f7c1773d885e232892c
        with:
          root: .
          max-diagnostics: "1000"
          # Git 2.55.0 official source tarball.
          # jig-ignore-next-line: official source digest is indivisible
          git-source-sha256: 457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357
